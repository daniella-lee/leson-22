<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <p id="demo"></p>
    <script>
        //create an object:
        var person = {
            firstName: "Daniella",
            age: 12,
        };

        //Display some data from the object:
        document.getElementById("demo").innerHTML = person.firstName + " is " + person.age + " years old "; 
    </script>
</body>
</html>
